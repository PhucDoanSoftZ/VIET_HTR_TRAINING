model:
  key: qwen3vl_4b
  id: unsloth/Qwen3-VL-4B-Instruct-unsloth-bnb-4bit
  revision: main # Pin a commit SHA for production runs; resolved SHA is recorded.
  gradient_checkpointing: unsloth
paths:
  data_dir: data/viet_htr
  checkpoint_dir: checkpoints
  output_dir: outputs
  resume_from: null
  warm_start_from_adapter: null
  adapter_dir: null
data:
  source: 5CD-AI/VietHTR-Line
  max_pixels: 1048576
  resize_policy: error # Explicitly choose downscale for an ablation.
  min_short_edge: 16
hardware:
  min_free_vram_gb: 12
  min_free_ram_gb: 8
  min_free_disk_gb: 20
lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules: null
  vision_layers: true
  language_layers: true
  attention_modules: true
  mlp_modules: true
training:
  batch_size: 1
  gradient_accumulation_steps: 4
  epochs: 2
  learning_rate: 0.0002
  warmup_steps: 50
  optimizer: adamw_8bit
  scheduler: linear
  save_steps: 250
  eval_steps: 250
  logging_steps: 10
  save_total_limit: 3
  max_seq_length: 2048
  seed: 3407
  early_stopping_patience: 0
  warmup_ratio: 0.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  dataloader_workers: 0
  pin_memory: true
  best_metric: eval_loss # Use eval_cer with a fixed validation_ocr_limit for OCR selection.
  validation_ocr_limit: 0
inference:
  prompt: "Transcribe the Vietnamese handwriting in this image exactly. Return only the transcription."
  max_new_tokens: 256
  do_sample: false
  num_beams: 1
  repetition_penalty: 1.0
evaluation:
  normalization: nfc_whitespace
  without_diacritics: false
logging:
  debug: false
